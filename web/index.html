<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="식판 — 기록을 나 혼자 하지 않아도 되는 식단·운동 기록 앱" />
  <title>식판</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/app/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- black-translucent은 상태바 아래로 콘텐츠를 넣습니다. viewport-fit=cover와
       헤더의 env(safe-area-inset-top) 패딩이 이미 있어야 성립하는데, 둘 다 있습니다.
       이게 없으면 다크 테마에서 상태바만 흰 띠로 남습니다. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="식판" />
  <link rel="stylesheet" href="/app/css/app.css" />
</head>
<body>
  <div id="root" class="app">
    <noscript>이 앱은 JavaScript가 필요합니다.</noscript>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app/js/app.mjs"></script>
</body>
</html>
