name: sikpan_app
description: "식판 — 기록을 나 혼자 하지 않아도 되는 식단·운동 기록 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP only — the server owns every rule, so the client needs no ORM,
  # no local cache layer, and no sync engine. It fetches and renders.
  http: ^1.2.2

  # Tokens go in the Keychain / Android Keystore, not in a plain prefs file.
  # A bearer token that grants access to someone's health record does not
  # belong in shared_preferences.
  flutter_secure_storage: ^9.2.2

  # Everything that is *not* a secret (selected canteen, outbox queue).
  shared_preferences: ^2.3.2

  image_picker: ^1.1.2
  go_router: ^14.6.1
  intl: ^0.19.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
