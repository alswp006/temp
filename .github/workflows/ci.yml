name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        # The stub vision provider means the suite needs no API key and no
        # network — CI exercises the same pipeline the app runs.
        env:
          VISION_PROVIDER: stub
          SECRET_KEY: ci-secret-not-used-anywhere-real
        run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrations apply from scratch
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          SECRET_KEY: ci-secret
        run: alembic upgrade head

      - name: Models and migrations agree
        # A model change without a migration is the single easiest way to break
        # a deploy, so fail the build rather than discover it in production.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          SECRET_KEY: ci-secret
        run: |
          alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sikpan
          POSTGRES_PASSWORD: sikpan
          POSTGRES_DB: sikpan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sikpan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Migrations apply on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://sikpan:sikpan@localhost:5432/sikpan
          SECRET_KEY: ci-secret
        run: alembic upgrade head

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      # 웹 빌드는 컴파일 회귀를 잡는 가장 싼 방법입니다. iOS는 macOS 러너가
      # 있어야 하고, 안드로이드 APK는 SDK 내려받느라 몇 분이 더 듭니다.
      # --no-web-resources-cdn: CanvasKit을 CDN 대신 번들에 넣습니다.
      - name: Build web
        working-directory: mobile
        run: flutter build web --no-web-resources-cdn

  # iOS는 리눅스에서 컴파일할 수 없어서 오랫동안 검증 밖에 있었고, 그 사이
  # sentry_flutter 8.14.2가 SwiftPM 경로에서 빌드를 깨뜨린 것을 아무도 몰랐다.
  # (플러그인의 Package.swift가 sentry-cocoa를 상한 없이 열어 두어 새 패치
  #  버전이 물리면서 API가 어긋났다.) 맥에서 사람이 돌려 보고서야 나왔다.
  #
  # 시뮬레이터 빌드는 서명이 필요 없으므로 비밀값 없이 돌아간다. 이것 하나로
  # "iOS에서만 안 되는" 부류를 PR 단계에서 잡는다.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Build iOS (simulator, unsigned)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --simulator --debug
