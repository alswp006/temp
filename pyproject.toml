[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sikpan"
version = "0.1.0"
description = "식판(Sikpan) — 같이 쓰는 식단·운동 기록 앱"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    # [email] pulls email-validator, which EmailStr needs at *schema build*
    # time — without it the app fails at import, not at request time.
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
    "argon2-cffi>=23.1",
    "PyJWT>=2.7",
    "greenlet>=3.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
# 크래시 리포팅. 없으면 app/observability.py가 조용히 비활성됩니다 —
# DSN을 안 넣은 개발 환경에서 의존성까지 받게 만들 이유가 없습니다.
sentry = ["sentry-sdk[fastapi]>=2.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.csv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
